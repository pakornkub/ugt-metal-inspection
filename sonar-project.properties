# SonarQube Project Configuration — Box Inspection System
#
# This repo is 3 services (Next.js frontend, Express backend, FastAPI
# ai-service) analyzed as ONE SonarQube project — simpler than 3 separate
# projects for a system this size, and the Quality Gate still measures new
# code per-file regardless of how many languages are in the project.
#
# Note: projectKey/projectName here are DEFAULTS only. The Jenkinsfile
# SonarQube Analysis stage overrides them per branch with -D flags:
#   main    → box-inspection      / Box Inspection System
#   develop → box-inspection-dev  / Box Inspection System (Dev)

sonar.projectKey=box-inspection
sonar.projectName=Box Inspection System

# Source files — paths relative to workspace root. Tests are co-located
# (*.test.ts next to the file it tests), so sonar.tests reuses the same
# dirs and sonar.test.inclusions narrows which files count as tests.
sonar.sources=frontend/app,frontend/components,frontend/lib,backend/src,ai-service
sonar.tests=frontend/app,frontend/components,frontend/lib,backend/src,ai-service
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test_*.py,**/*_test.py

# Full exclusions — file NOT analyzed at all.
sonar.exclusions=\
  **/.next/**,\
  **/node_modules/**,\
  **/generated/**,\
  **/dist/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/*.config.*,\
  **/*.d.ts,\
  **/public/**,\
  ai-service/models/**,\
  **/__pycache__/**,\
  **/.venv/**

# Coverage — lcov.info is generated by: npm run test:coverage (frontend + backend)
# ponytail: ai-service has no coverage report yet (no pytest suite) — its files
# read as 0% covered. Add pytest + sonar.python.coverage.reportPaths if/when
# ai-service grows beyond the current predictor/main.py.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
sonar.python.version=3.11

sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/generated/**,\
  **/*.config.*

# ── Duplication (CPD) exclusions ─────────────────────────────────────────────
# RULE: every entry MUST have a rationale comment above it. Start EMPTY — add
# entries only when a real duplication finding is reviewed and judged
# intentional.

# ── Rule suppressions (false positives only) ─────────────────────────────────
# RULE: every suppression MUST have a rationale comment explaining WHY it is a
# false positive for this codebase. Start EMPTY — add only after reviewing a
# real finding.

sonar.sourceEncoding=UTF-8

# ── OWASP Dependency-Check integration ───────────────────────────────────────
# Requires SonarQube Dependency-Check plugin v6.0.0+. dc-report/ is generated
# by the OWASP stage in the Jenkinsfile before sonar-scanner runs.
sonar.dependencyCheck.jsonReportPath=dc-report/dependency-check-report.json
sonar.dependencyCheck.htmlReportPath=dc-report/dependency-check-report.html
sonar.dependencyCheck.severity.high=7.0
sonar.dependencyCheck.severity.medium=4.0
sonar.dependencyCheck.severity.low=0.0
