# Production compose — deployed by Jenkins on the `main` branch via
# `TAG=<build-number> docker compose up -d --no-build` (images are already
# built + tagged by the Docker Build stage; compose never rebuilds at deploy
# time). For local testing: `docker compose --env-file .env up --build`.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: box-inspection-mssql
    environment:
      SA_PASSWORD: "${DB_PASSWORD:-YourStrong!Passw0rd}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      # ponytail: named volume, not a /srv/appdata bind mount — the official
      # mssql image's entrypoint expects to own this path (uid 10001) and
      # fixing that on an arbitrary host bind mount is a known footgun.
      # Uploads (our own data) use the bind-mount contract below instead.
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:-YourStrong!Passw0rd}' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - box-inspection-net

  ai-service:
    build: ./ai-service
    image: box-inspection-ai:${TAG:-latest}
    pull_policy: never
    container_name: box-inspection-ai
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      AI_MOCK: "false"
      MODEL_PATH: "models/box_lock_model.pt"
      AI_CONF_THRESHOLD: "0.25"
    volumes:
      - ./ai-service/models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - box-inspection-net

  backend:
    build: ./backend
    image: box-inspection-backend:${TAG:-latest}
    pull_policy: never
    container_name: box-inspection-backend
    ports:
      - "${BACKEND_PORT:-3101}:3101"
    environment:
      DATABASE_URL: "sqlserver://mssql:1433;database=box_inspection;user=sa;password=${DB_PASSWORD:-YourStrong!Passw0rd};encrypt=false;trustServerCertificate=true"
      PORT: "3101"
      AI_SERVICE_URL: "http://ai-service:8000"
      UPLOAD_DIR: "uploads"
    volumes:
      # ponytail: bind mount under /srv/appdata instead of a named volume
      - /srv/appdata/box-inspection/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3101/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      mssql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - box-inspection-net

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: "http://backend:3101"
        # NEXT_PUBLIC_* must be build args (compile-time, inlined into the
        # bundle) — setting them under environment: below has no effect.
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-/ugt-metal-inspection}"
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://ugtweb.ube.co.th/ugt-metal-inspection}"
    image: box-inspection-frontend:${TAG:-latest}
    pull_policy: never
    container_name: box-inspection-frontend
    ports:
      - "${FRONTEND_PORT:-3100}:3100"
    environment:
      BACKEND_URL: "http://backend:3101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ugt-metal-inspection/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - box-inspection-net

volumes:
  mssql_data:
    name: box-inspection-mssql-data

networks:
  box-inspection-net:
    name: box-inspection-network
