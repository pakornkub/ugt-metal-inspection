# Production compose — deployed by Jenkins on the `main` branch via
# `TAG=<build-number> docker compose up -d --no-build` (images are already
# built + tagged by the Docker Build stage; compose never rebuilds at deploy
# time). For local testing: `docker compose --env-file .env up --build`.
services:
  ai-service:
    build: ./ai-service
    image: ugt-metal-inspection-ai:${TAG:-latest}
    pull_policy: never
    container_name: ugt-metal-inspection-ai
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      # Overridable via .env — see docker-compose.dev.yml comment. Prod should
      # always run with a real model (AI_MOCK unset/false); the override
      # exists so a missing model file is diagnosable, not deployable-around.
      AI_MOCK: "${AI_MOCK:-false}"
      MODEL_PATH: "models/box_lock_model.pt"
      AI_CONF_THRESHOLD: "0.25"
    volumes:
      # Absolute host path, NOT a relative repo path — Jenkins runs inside its
      # own container talking to the HOST's Docker daemon (DooD); a relative
      # path resolves against $PWD (Jenkins' own workspace, which doesn't
      # exist on the real host) and fails the same way this would if it
      # weren't already absolute.
      # ponytail: /home/docker02/appdata, NOT the usual org /srv/appdata —
      # this host's Docker is snap-installed, whose AppArmor confinement only
      # allows $HOME/mnt/media, not /srv. See troubleshooting.md + decisions.md.
      - /home/docker02/appdata/ugt-metal-inspection/models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - proxy-network

  backend:
    build: ./backend
    image: ugt-metal-inspection-backend:${TAG:-latest}
    pull_policy: never
    container_name: ugt-metal-inspection-backend
    ports:
      - "${BACKEND_PORT:-3101}:3101"
    environment:
      # DATABASE_URL points at the org's existing SQL Server — supplied via
      # the env-ugt-metal-inspection Jenkins credential (.env), never hardcoded here.
      # Example: sqlserver://<host>:1433;database=UGT_MetalInspection;user=<user>;password=<pw>;encrypt=true;trustServerCertificate=false
      DATABASE_URL: "${DATABASE_URL}"
      PORT: "3101"
      AI_SERVICE_URL: "http://ai-service:8000"
      UPLOAD_DIR: "uploads"
    volumes:
      # ponytail: /home/docker02/appdata, not /srv/appdata — see the models
      # volume comment above (snap Docker confinement on this host).
      - /home/docker02/appdata/ugt-metal-inspection/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3101/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy-network

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: "http://backend:3101"
        # NEXT_PUBLIC_* must be build args (compile-time, inlined into the
        # bundle) — setting them under environment: below has no effect.
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-/ugt-metal-inspection}"
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://ugtweb.ube.co.th/ugt-metal-inspection}"
    image: ugt-metal-inspection-frontend:${TAG:-latest}
    pull_policy: never
    container_name: ugt-metal-inspection-frontend
    ports:
      - "${FRONTEND_PORT:-3100}:3100"
    environment:
      BACKEND_URL: "http://backend:3101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ugt-metal-inspection/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
