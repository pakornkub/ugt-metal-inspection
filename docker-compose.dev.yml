# Dev compose — deployed by Jenkins on the `develop` branch. Same shape as
# docker-compose.yml with -dev names, offset host ports, and a separate DB so
# dev data never touches prod. Local run: `docker compose -f docker-compose.dev.yml --env-file .env.dev up --build`.
services:
  ai-service:
    build: ./ai-service
    image: ugt-metal-inspection-ai-dev:${TAG:-latest}
    pull_policy: never
    container_name: ugt-metal-inspection-ai-dev
    ports:
      - "${AI_PORT:-8010}:8000"
    environment:
      AI_MOCK: "false"
      MODEL_PATH: "models/box_lock_model.pt"
      AI_CONF_THRESHOLD: "0.25"
    volumes:
      # Absolute /srv/appdata path — see docker-compose.yml comment (DooD:
      # relative paths resolve against Jenkins' own container, not the host).
      - /srv/appdata/ugt-metal-inspection-dev/models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - proxy-network

  backend:
    build: ./backend
    image: ugt-metal-inspection-backend-dev:${TAG:-latest}
    pull_policy: never
    container_name: ugt-metal-inspection-backend-dev
    ports:
      - "${BACKEND_PORT:-3111}:3101"
    environment:
      # DATABASE_URL points at the org's existing SQL Server (a separate dev
      # database from prod) — supplied via the env-ugt-metal-inspection-dev Jenkins
      # credential (.env.dev), never hardcoded here.
      DATABASE_URL: "${DATABASE_URL}"
      PORT: "3101"
      AI_SERVICE_URL: "http://ai-service:8000"
      UPLOAD_DIR: "uploads"
    volumes:
      - /srv/appdata/ugt-metal-inspection-dev/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3101/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy-network

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: "http://backend:3101"
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-/ugt-metal-inspection-dev}"
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://ugtweb.ube.co.th/ugt-metal-inspection-dev}"
    image: ugt-metal-inspection-frontend-dev:${TAG:-latest}
    pull_policy: never
    container_name: ugt-metal-inspection-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3110}:3100"
    environment:
      BACKEND_URL: "http://backend:3101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ugt-metal-inspection-dev/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
